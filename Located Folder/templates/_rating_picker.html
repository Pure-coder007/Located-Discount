{% set current_rating = own_rating(deal.id if deal is defined else code.deal_id) %}
<fieldset class="rating-picker" data-rating-picker>
  <legend>How would you rate this deal?</legend>
  <p>Your opinion helps others discover great offers.</p>
  <div class="rating-stars" aria-label="Choose one to five stars">
  {% for star in range(1,6) %}<label class="rating-star{% if (request.form.get('stars', (current_rating.stars|string if current_rating else '0'))|int) >= star %} is-filled{% endif %}"><input type="radio" name="stars" value="{{ star }}" {% if request.form.get('stars', (current_rating.stars|string if current_rating else '')) == star|string %}checked{% endif %} aria-label="{{ star }} star{{ 's' if star != 1 else '' }}"><span aria-hidden="true">★</span></label>{% endfor %}
  </div>
  <div class="rating-footer"><output aria-live="polite" data-rating-preview>Optional · choose your stars</output><button type="button" data-rating-clear>Clear</button></div>
</fieldset>
