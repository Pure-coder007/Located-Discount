{% extends 'base.html' %}
{% block title %}Choose a new password | Locatediscount{% endblock %}
{% block content %}
<section class="app-card mx-auto max-w-lg p-8 sm:p-10">
  <p class="app-label">Secure password reset</p><h1 class="mt-2 text-3xl font-semibold tracking-tight">Choose a new password</h1>
  <p class="mt-3 text-sm text-slate-500">Resetting access for {{ account_email }}. Use at least 12 characters with a letter and number.</p>
  <form method="post" class="mt-7 space-y-5"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div><label class="app-label" for="password">New password</label><input class="app-input" id="password" name="password" type="password" minlength="12" autocomplete="new-password" required></div>
    <div><label class="app-label" for="password_confirmation">Confirm password</label><input class="app-input" id="password_confirmation" name="password_confirmation" type="password" minlength="12" autocomplete="new-password" required></div>
    <button class="app-button w-full" type="submit">Reset password <i class="bi bi-shield-check"></i></button>
  </form>
</section>
{% endblock %}
