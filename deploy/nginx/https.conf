server {
    listen 80;
    server_name locatediscount.ng www.locatediscount.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://locatediscount.ng$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.locatediscount.ng;
    ssl_certificate /etc/letsencrypt/live/locatediscount.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locatediscount.ng/privkey.pem;
    return 301 https://locatediscount.ng$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name locatediscount.ng;

    ssl_certificate /etc/letsencrypt/live/locatediscount.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locatediscount.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 30m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /ws/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
